# KAVANA Route AI — backend en Fly.io (formato machines, patrón Steelworks)
# https://fly.io/docs/apps/configure/
app = "kavana-routeai-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5001"
  DATA_DIR = "/app/data"
  # Secretos NO van aquí: se configuran con `fly secrets set` (JWT_SECRET,
  # OFFICE_PIN, PGHOST/PGUSER/PGPASSWORD/PGDATABASE, OPENROUTER_API_KEY, ...)

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # P2 (auditoría 2026-08-23): health check HTTP real — Fly reinicia la
  # máquina si /health deja de responder y no enruta tráfico a instancias
  # muertas (antes solo existía el endpoint, sin checks de infraestructura).
  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "15s"
    method = "get"
    path = "/health"

# Volumen persistente para PODs (PDFs) y fotos de incidencias en /app/data.
# Creado con:
#   flyctl volumes create routeai_data --app kavana-routeai-api --region cdg --size 1
[mounts]
  source = "routeai_data"
  destination = "/app/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
